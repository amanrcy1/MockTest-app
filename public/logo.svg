<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Gradient for the lightning bolt -->
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- Gradient for the book/document -->
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#f8fafc" filter="url(#shadow)"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#bookGradient)" stroke-width="4"/>
  
  <!-- Stylized "M" made of document/paper shape -->
  <g transform="translate(100, 100)">
    <!-- Left page of M -->
    <path d="M-45 -35 L-45 40 L-15 40 L-15 -10 L-30 -35 Z" 
          fill="url(#bookGradient)" 
          opacity="0.9"/>
    
    <!-- Right page of M -->
    <path d="M45 -35 L45 40 L15 40 L15 -10 L30 -35 Z" 
          fill="url(#bookGradient)" 
          opacity="0.9"/>
    
    <!-- Center connector (forms the M valley) -->
    <path d="M-15 -10 L0 15 L15 -10 L15 40 L-15 40 Z" 
          fill="#1e40af"/>
    
    <!-- Lightning bolt with glow animation -->
    <g filter="url(#boltGlow)">
      <path d="M5 -45 L-12 -5 L2 -5 L-8 25 L18 -15 L5 -15 L15 -45 Z" 
            fill="url(#boltGradient)">
        <animate 
          attributeName="opacity" 
          values="0.8;1;0.8" 
          dur="2s" 
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </path>
      
      <!-- Bright flash overlay -->
      <path d="M5 -45 L-12 -5 L2 -5 L-8 25 L18 -15 L5 -15 L15 -45 Z" 
            fill="#fef3c7"
            opacity="0">
        <animate 
          attributeName="opacity" 
          values="0;0.6;0" 
          dur="2s" 
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </path>
    </g>
  </g>
  
  <!-- Small checkmark accent -->
  <path d="M145 55 L155 65 L175 40" 
        fill="none" 
        stroke="#22c55e" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Progress dots at bottom -->
  <circle cx="70" cy="160" r="6" fill="#3b82f6"/>
  <circle cx="100" cy="160" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="130" cy="160" r="6" fill="#3b82f6" opacity="0.3"/>
</svg>